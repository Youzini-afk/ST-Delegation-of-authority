name: CI

on:
  pull_request:
  push:

jobs:
  validate:
    name: Validate ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke standalone recovery CLI
        run: node packages/server-plugin/dist/authority/agent.cjs rescue workspaces --store "${{ runner.temp }}/authority-recovery-smoke"

      - name: Benchmark gate
        if: matrix.os == 'ubuntu-latest'
        env:
          AUTHORITY_BENCH_MAX_AVG_MS: '150'
          AUTHORITY_BENCH_MAX_P95_MS: '300'
        run: npm run bench:core
