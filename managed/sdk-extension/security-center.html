<div class="authority-panel authority-panel--security-center">
  <div class="authority-workbench">
    <header class="authority-workbench__bar">
      <div class="authority-workbench__brand">
        <span class="authority-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4.5 7.25v9.5L12 21l7.5-4.25v-9.5L12 3Z"/><path d="m8.25 12 2.35 2.35L16 9"/></svg>
        </span>
        <strong class="authority-workbench__title">Delegation of Authority</strong>
      </div>

      <nav class="authority-area-tabs" aria-label="Authority 主导航">
        <button type="button" class="authority-area-tab" data-area="agent" data-tab="agent" id="security-center-tab-agent">
          <span>Agent</span>
        </button>
        <button type="button" class="authority-area-tab" data-area="governance" data-tab="detail">
          <span>扩展</span>
        </button>
        <button type="button" class="authority-area-tab" data-area="system" data-tab="updates" id="security-center-tab-updates">
          <span>系统与恢复</span>
        </button>
        <button type="button" class="authority-area-tab" data-area="settings" data-tab="settings" id="security-center-tab-settings" data-admin-only>
          <span>设置</span>
        </button>
      </nav>

      <div class="authority-workbench__actions">
        <div class="authority-health-badges" data-role="health-badges"></div>
        <button type="button" class="authority-icon-button" data-action="refresh" aria-label="刷新 Authority 状态" title="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
        </button>
      </div>
    </header>

    <div class="authority-app-shell">
      <div class="authority-workbench__main">
        <div class="authority-alert-dock" data-role="status" aria-live="polite"></div>
        <div class="authority-workbench__body">
          <section class="authority-area-panel" data-area-panel="agent">
            <section class="authority-section" data-section="agent" role="tabpanel" id="security-center-tabpanel-agent" aria-labelledby="security-center-tab-agent">
              <div class="sr-only" data-role="agent-live-status" role="status" aria-live="polite" aria-atomic="true"></div>
              <div data-role="agent-view"></div>
            </section>
          </section>

          <section class="authority-area-panel authority-area-panel--governance" data-area-panel="governance">
            <div class="authority-governance-shell">
              <div class="authority-governance-layout">
                <aside class="authority-extension-nav" aria-label="扩展目录">
                  <div class="authority-extension-nav__header">
                    <strong>扩展治理</strong>
                    <span class="authority-directory-count" data-role="extension-count">0</span>
                  </div>
                  <label class="authority-extension-search">
                    <span class="authority-extension-search__icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    </span>
                    <span class="sr-only">搜索扩展</span>
                    <input class="text_pole authority-search" type="search" data-role="extension-search" placeholder="搜索扩展…" aria-label="搜索扩展" />
                  </label>
                  <div class="authority-extension-nav__list" data-role="extension-list"></div>
                  <nav class="authority-tabs" role="tablist" aria-label="扩展治理视图" data-role="governance-tabs">
                      <button type="button" class="authority-tab" data-tab="detail" role="tab" id="security-center-tab-detail" aria-selected="false" aria-controls="security-center-tabpanel-detail">扩展</button>
                      <button type="button" class="authority-tab" data-tab="overview" role="tab" id="security-center-tab-overview" aria-selected="false" aria-controls="security-center-tabpanel-overview">概览</button>
                      <button type="button" class="authority-tab" data-tab="databases" role="tab" id="security-center-tab-databases" aria-selected="false" aria-controls="security-center-tabpanel-databases">数据</button>
                      <button type="button" class="authority-tab" data-tab="activity" role="tab" id="security-center-tab-activity" aria-selected="false" aria-controls="security-center-tabpanel-activity">审计</button>
                      <button type="button" class="authority-tab" data-tab="policies" role="tab" id="security-center-tab-policies" aria-selected="false" aria-controls="security-center-tabpanel-policies">策略</button>
                  </nav>
                </aside>

                <div class="authority-governance-stage">
                  <div class="authority-view-canvas">
                    <section class="authority-section" data-section="detail" role="tabpanel" id="security-center-tabpanel-detail" aria-labelledby="security-center-tab-detail">
                      <div class="authority-governance-detail" data-role="detail-view"></div>
                    </section>
                    <section class="authority-section" data-section="overview" role="tabpanel" id="security-center-tabpanel-overview" aria-labelledby="security-center-tab-overview">
                      <div data-role="overview-view"></div>
                    </section>
                    <section class="authority-section" data-section="databases" role="tabpanel" id="security-center-tabpanel-databases" aria-labelledby="security-center-tab-databases">
                      <div data-role="databases-view"></div>
                    </section>
                    <section class="authority-section" data-section="activity" role="tabpanel" id="security-center-tabpanel-activity" aria-labelledby="security-center-tab-activity">
                      <div data-role="activity-view"></div>
                    </section>
                    <section class="authority-section" data-section="policies" role="tabpanel" id="security-center-tabpanel-policies" aria-labelledby="security-center-tab-policies">
                      <div data-role="policies-view"></div>
                    </section>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="authority-area-panel" data-area-panel="system">
            <section class="authority-section" data-section="updates" role="tabpanel" id="security-center-tabpanel-updates" aria-labelledby="security-center-tab-updates">
              <div data-role="updates-view"></div>
            </section>
          </section>

          <section class="authority-area-panel" data-area-panel="settings">
            <section class="authority-section" data-section="settings" role="tabpanel" id="security-center-tabpanel-settings" aria-labelledby="security-center-tab-settings">
              <div data-role="settings-view"></div>
            </section>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
